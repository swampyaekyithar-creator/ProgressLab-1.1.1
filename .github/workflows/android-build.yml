name: Build ProgressLab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository!"
            ls -la
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"

          if unzip -t "$ZIP_FILE" >/dev/null 2>&1; then
            unzip -o "$ZIP_FILE"
          else
            echo "Not a raw binary ZIP. Attempting Base64 decode..."
            python3 -c 'import base64, sys; d = open(sys.argv[1], "rb").read(); d = d.split(b"base64,", 1)[1] if b"base64," in d[:120] else d; open("decoded.zip", "wb").write(base64.b64decode(d))' "$ZIP_FILE" || true
            if unzip -t decoded.zip >/dev/null 2>&1; then
              echo "Successfully decoded Base64 ZIP!"
              unzip -o decoded.zip
            else
              echo "ERROR: File is not a valid ZIP. First 200 bytes:"
              head -c 200 "$ZIP_FILE" || true
              echo ""
              exit 1
            fi
          fi

          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found after unzip!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Gradle project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Run Unit Tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProgressLab-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
