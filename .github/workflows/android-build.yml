name: Build ProgressLab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ProgressLab Bundle
        run: |
          set -e
          B64_FILE=$(find . -maxdepth 2 -type f -iname "*.txt" | head -n 1)
          if [ -z "$B64_FILE" ]; then
            echo "ERROR: No .txt bundle file found!"
            ls -la
            exit 1
          fi
          echo "Decoding $B64_FILE..."
          base64 -d "$B64_FILE" > progresslab_decoded.zip
          unzip -o progresslab_decoded.zip

          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory ready: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Run Unit Tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProgressLab-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
